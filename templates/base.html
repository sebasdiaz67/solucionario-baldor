<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Solucionario de Álgebra</title>
    
    <!-- MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.6;
            color: #333;
            background-color: #fafafa;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 2rem 1rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        
        .sidebar h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 1rem;
        }
        
        .nav-menu {
            list-style: none;
        }
        
        .nav-menu li {
            margin-bottom: 0.5rem;
        }
        
        .nav-menu a {
            color: #ecf0f1;
            text-decoration: none;
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .nav-menu a:hover {
            background-color: #3498db;
            transform: translateX(5px);
        }
        
        .nav-menu a.active {
            background-color: #3498db;
            font-weight: bold;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem;
            max-width: 900px;
        }
        
        .content-wrapper {
            background: white;
            padding: 2rem 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        h1, h2, h3 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        
        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 3px solid #3498db;
            padding-bottom: 1rem;
        }
        
        h2 {
            font-size: 1.8rem;
            margin-top: 2rem;
        }
        
        /* Exercise Cards */
        .exercise-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 2rem;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }
        
        .exercise-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .exercise-header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .exercise-id {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .exercise-problem {
            padding: 1.5rem;
            font-size: 1.2rem;
            text-align: center;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .solution-section {
            padding: 1.5rem;
            background-color: #fff;
        }
        
        .solution-toggle {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        
        .solution-toggle:hover {
            background: linear-gradient(135deg, #229954 0%, #1e8449 100%);
            transform: translateY(-2px);
        }
        
        .solution-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .solution-content.show {
            display: block;
        }
        
        .steps {
            margin-bottom: 1.5rem;
        }
        
        .step {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background-color: #f1f8ff;
            border-left: 4px solid #3498db;
            border-radius: 0 5px 5px 0;
        }
        
        .step-number {
            font-weight: bold;
            color: #3498db;
            margin-right: 0.5rem;
        }
        
        .final-solution {
            padding: 1rem;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border-radius: 5px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        /* Controls */
        .controls {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            margin: 0 0.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: linear-gradient(135deg, #8e44ad 0%, #7d3c98 100%);
            transform: translateY(-2px);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            
            .main-content {
                margin-left: 200px;
                padding: 1rem;
            }
            
            .content-wrapper {
                padding: 1rem;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            
            .main-content {
                margin-left: 0;
            }
        }
        
        /* MathJax adjustments */
        .MathJax {
            font-size: 1.1em !important;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>📚 Solucionario de Álgebra</h1>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">🏠 Inicio</a></li>
                    {% for chapter in chapters %}
                    <li><a href="capitulo-{{ chapter.slug }}.html">{{ loop.index }}. {{ chapter.title }}</a></li>
                    {% endfor %}
                </ul>
            </nav>
        </aside>
        
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <script>
        // Configuración de MathJax
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                processHtmlClass: 'mathjax'
            }
        };
        
        // Función para mostrar/ocultar soluciones
        function toggleSolution(button) {
            const solutionContent = button.nextElementSibling;
            solutionContent.classList.toggle('show');
            
            if (solutionContent.classList.contains('show')) {
                button.textContent = '🙈 Ocultar Solución';
            } else {
                button.textContent = '👁️ Ver Solución';
            }
            
            // Re-render MathJax after showing solution
            if (solutionContent.classList.contains('show')) {
                MathJax.typesetPromise([solutionContent]);
            }
        }
        
        // Función para mostrar todas las soluciones
        function showAllSolutions() {
            const buttons = document.querySelectorAll('.solution-toggle');
            const contents = document.querySelectorAll('.solution-content');
            
            buttons.forEach(button => button.textContent = '🙈 Ocultar Solución');
            contents.forEach(content => {
                content.classList.add('show');
            });
            
            MathJax.typesetPromise();
        }
        
        // Función para ocultar todas las soluciones
        function hideAllSolutions() {
            const buttons = document.querySelectorAll('.solution-toggle');
            const contents = document.querySelectorAll('.solution-content');
            
            buttons.forEach(button => button.textContent = '👁️ Ver Solución');
            contents.forEach(content => {
                content.classList.remove('show');
            });
        }
        
        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
        
        // Highlight current chapter in sidebar
        function highlightCurrentChapter() {
            const currentPath = window.location.pathname;
            const links = document.querySelectorAll('.nav-menu a');
            
            links.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === currentPath.split('/').pop()) {
                    link.classList.add('active');
                }
            });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            highlightCurrentChapter();
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
